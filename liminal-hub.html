<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liminal Reborn — Game Hub</title>
<style>
  :root{
    --accent:#5986da;
    --accent-hover:#79aadb;
    --bg1:#2e3244;
    --bg2:#36224b;
    --panel:rgba(0,0,0,0.30);
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    min-height:100vh;margin:0;padding:0;display:flex;color:#fff;
  }

  /* ---- A-Z sidebar ---- */
  .sidebar{
    position:fixed;left:0;top:0;width:80px;height:100vh;
    background:var(--panel);backdrop-filter:blur(10px);
    padding:20px 10px;display:flex;flex-direction:column;gap:8px;
    overflow-y:auto;box-shadow:2px 0 10px rgba(0,0,0,0.3);z-index:1000;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:3px;}
  .sidebar-btn{
    background:var(--accent);border:none;padding:12px;font-size:18px;font-weight:700;
    border-radius:8px;cursor:pointer;transition:all .2s ease;color:#fff;text-align:center;min-height:45px;
  }
  .sidebar-btn:hover{background:var(--accent-hover);transform:scale(1.05);}
  .sidebar-btn.empty{opacity:.4;cursor:default;}
  .sidebar-btn.empty:hover{transform:none;background:var(--accent);}

  /* ---- main ---- */
  .main-content{margin-left:100px;flex:1;padding:20px;}

  .hero{text-align:center;margin:10px auto 24px;max-width:900px;}
  .hero h1{
    font-size:44px;margin:0;letter-spacing:1px;
    background:linear-gradient(90deg,#9db8ff,#c89bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 14px rgba(140,120,255,.25);
  }
  .hero .tag{color:rgba(255,255,255,.7);font-size:15px;margin-top:6px;}
  .hero .tag a{color:var(--accent-hover);text-decoration:none;}
  .hero .tag a:hover{text-decoration:underline;}

  /* ---- sticky search ---- */
  .search-wrap{
    position:sticky;top:0;z-index:900;padding:14px 0 18px;
    background:linear-gradient(180deg,rgba(46,50,68,.95) 60%,rgba(46,50,68,0));
    backdrop-filter:blur(4px);text-align:center;
  }
  .search-box{
    display:inline-flex;align-items:center;gap:10px;width:100%;max-width:520px;
    background:rgba(255,255,255,.95);border-radius:12px;padding:4px 6px 4px 16px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .search-box svg{flex:0 0 auto;opacity:.55;}
  #searchInput{
    flex:1;border:none;outline:none;background:transparent;padding:12px 4px;
    font-size:16px;color:#1b1b2b;
  }
  #count{margin-top:10px;font-size:13px;color:rgba(255,255,255,.6);min-height:16px;}

  /* ---- sections ---- */
  .letter-section{margin-bottom:40px;padding:0 20px;max-width:900px;margin-left:auto;margin-right:auto;min-height:60px;}
  .letter-section.empty{opacity:.45;}
  .letter-header{
    font-size:30px;font-weight:bold;margin-bottom:15px;padding-bottom:10px;
    border-bottom:3px solid rgba(255,255,255,.25);text-shadow:2px 2px 4px rgba(0,0,0,.3);
  }
  .buttons-container{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .empty-message{color:rgba(255,255,255,.55);font-style:italic;text-align:center;padding:14px;}

  input[type="button"]{
    background:var(--accent);border:none;padding:15px 22px;font-size:16px;font-weight:500;
    border-radius:10px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.12);
    transition:all .25s ease;width:100%;max-width:600px;color:#fff;text-align:left;
  }
  input[type="button"]:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,.25);background:var(--accent-hover);}
  input[type="button"]:active{transform:translateY(0);}

  #lolbutton{
    display:block;margin:18px auto 0;background:transparent;color:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.25);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13px;
  }
  #lolbutton:hover{background:rgba(255,255,255,.08);}

  .loading{text-align:center;color:rgba(255,255,255,.6);padding:40px;font-size:16px;}

  @media (max-width:768px){
    .sidebar{width:54px;padding:15px 5px;}
    .sidebar-btn{padding:8px;font-size:15px;min-height:38px;}
    .main-content{margin-left:62px;}
    .hero h1{font-size:32px;}
  }
</style>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>

  <div class="main-content">
    <div class="hero">
      <h1>Liminal Reborn</h1>
      <div class="tag">A school gaming project &middot; game hub prototype &middot; sourced from <a href="https://github.com/bitball41/liminal-ugs" target="_blank">liminal-ugs</a></div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search games…" autocomplete="off" spellcheck="false">
      </div>
      <div id="count"></div>
    </div>

    <div id="sections-container">
      <div class="loading" id="loadingMsg">Loading games…</div>
    </div>

    <button id="lolbutton" onclick="window.location.reload();">
      Games not showing? Click to reload
    </button>
  </div>

  <!-- Renders the A–Z game sections; each button fetches its game from this repo's UGS-Files -->
  <script src="https://cdn.jsdelivr.net/gh/bitball41/liminal-ugs@main/games.js"></script>

  <!-- Live search over the rendered game buttons -->
  <script>
  (function(){
    var input = document.getElementById('searchInput');
    var count = document.getElementById('count');
    var cachedSections = [];   // [{ el, buttons:[{ el, text }] }]
    var totalCount = 0;

    function runSearch(){
      var query = input.value.toLowerCase().trim();
      var shown = 0;
      cachedSections.forEach(function(sec){
        var anyVisible = false;
        sec.buttons.forEach(function(item){
          var matches = query === '' || item.text.includes(query);
          item.el.style.display = matches ? '' : 'none';
          if (matches){ anyVisible = true; shown++; }
        });
        sec.el.style.display = anyVisible ? '' : 'none';
      });
      if (query === '') count.textContent = totalCount + ' games loaded';
      else count.textContent = shown + ' result' + (shown === 1 ? '' : 's') + ' for "' + input.value.trim() + '"';
    }

    input.addEventListener('input', runSearch);

    // games.js builds sections asynchronously after its <script> runs; wait for them to appear.
    var tries = 0;
    var poll = setInterval(function(){
      var loaded = document.querySelectorAll('.letter-section input[type="button"]').length > 0;
      if (loaded || ++tries > 100){
        clearInterval(poll);
        var lm = document.getElementById('loadingMsg');
        if (lm) lm.remove();
        if (loaded){
          // Cache nodes and pre-lowercase titles once so each keystroke does zero DOM queries.
          document.querySelectorAll('.letter-section').forEach(function(section){
            var buttons = [];
            section.querySelectorAll('input[type="button"]').forEach(function(btn){
              buttons.push({ el: btn, text: btn.value.toLowerCase() });
              totalCount++;
            });
            cachedSections.push({ el: section, buttons: buttons });
          });
          runSearch();
        } else {
          count.textContent = 'Could not load games — try the reload button.';
        }
      }
    }, 100);
  })();
  </script>
</body>
</html>
