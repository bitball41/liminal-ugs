name: Sync working Brotato build

on:
  push:
    paths:
      - '.github/workflows/sync-brotato-working.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good Brotato HTML
        run: |
          curl --fail --show-error --silent \
            'https://ucgjwrjqmexenmrpbdkh.supabase.co/storage/v1/object/public/liminal-games/brotato.html' \
            -o UGS-Files/Brotato.html
      - name: Commit exact working copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UGS-Files/Brotato.html
          git commit -m 'Sync Brotato with known-good Supabase build [skip ci]'
          git push
      - name: Purge jsDelivr
        run: |
          curl --fail --show-error --silent \
            'https://purge.jsdelivr.net/gh/bitball41/liminal-ugs@main/UGS-Files/Brotato.html'
